name: Mac checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test with synthetic captures and fake AI
        run: swift test
