name: Windows checks

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "shared/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "shared/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build FDistractions.Windows.slnx --configuration Release
      # The opt-in live Claude Code test stays skipped: FDISTRACTIONS_LIVE_CLAUDE_IMAGES is never set here,
      # so CI needs no sign-in, sends no screenshots and uses no Claude plan quota.
      - name: Test with synthetic fixtures and a fake Claude Code
        run: dotnet test FDistractions.Windows.slnx --configuration Release --no-build
